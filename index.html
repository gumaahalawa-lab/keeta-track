<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Keeta Track</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--pi:#6c35de;--pi-dark:#4a1fa8;--pi-light:#9b6ef3;--gold:#f5a623;--green:#27ae60;--red:#e74c3c;--bg:#0f0c1a;--card:#1a1530;--card2:#221d3a;--text:#f0eaff;--muted:#8a7faa;--border:#2e2650;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Inter',sans-serif;}
    body[dir="rtl"]{font-family:'Cairo',sans-serif;}
    .lang-bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;background:rgba(108,53,222,0.12);border-bottom:1px solid var(--border);justify-content:center;}
    .lang-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#ccc;padding:3px 9px;border-radius:20px;cursor:pointer;font-size:0.72rem;transition:.2s;font-family:inherit;}
    .lang-btn:hover,.lang-btn.active{background:var(--pi);border-color:var(--pi);color:#fff;}
    nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
    .nav-logo{display:flex;align-items:center;gap:10px;}
    .nav-logo img{width:38px;height:38px;border-radius:10px;}
    .nav-logo-text{font-size:1.15rem;font-weight:900;color:var(--pi-light);}
    .btn-login{background:var(--pi);color:#fff;border:none;padding:7px 16px;border-radius:25px;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit;}
    .hero{background:linear-gradient(135deg,#1a0840,#0f0c1a);padding:32px 16px 20px;text-align:center;}
    .hero h1{font-size:1.8rem;font-weight:900;margin-bottom:8px;}
    .hero h1 span{color:var(--gold);}
    .hero p{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
    .search-bar{display:flex;gap:8px;max-width:500px;margin:0 auto;}
    .search-bar input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:25px;font-size:.9rem;outline:none;font-family:inherit;}
    .search-bar button{background:var(--pi);color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:700;cursor:pointer;font-family:inherit;}
    .stats-bar{display:flex;justify-content:center;gap:24px;padding:16px;flex-wrap:wrap;}
    .stat{text-align:center;}
    .stat-num{font-size:1.3rem;font-weight:900;color:var(--pi-light);}
    .stat-label{font-size:.72rem;color:var(--muted);}
    .section{padding:14px 16px;max-width:1100px;margin:0 auto;}
    .section-title{font-size:1.05rem;font-weight:700;margin-bottom:12px;}
    .track-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;}
    .track-id{font-weight:900;color:var(--pi-light);}
    .badge{background:rgba(245,166,35,0.15);color:var(--gold);padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700;}
    .steps{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap;}
    .step{flex:1;text-align:center;font-size:.65rem;color:var(--muted);min-width:50px;}
    .step.done{color:var(--green);}
    .step.active{color:var(--gold);font-weight:700;}
    .step-dot{width:10px;height:10px;border-radius:50%;background:var(--border);margin:0 auto 4px;}
    .step.done .step-dot{background:var(--green);}
    .step.active .step-dot{background:var(--gold);}
    .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:12px;}
    .plan-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
    .plan-card.featured{border-color:var(--pi-light);background:linear-gradient(135deg,rgba(108,53,222,.15),var(--card));}
    .plan-name{font-weight:900;font-size:1rem;margin-bottom:6px;}
    .plan-price{font-size:1.4rem;font-weight:900;color:var(--gold);margin-bottom:10px;}
    .plan-features{list-style:none;font-size:.78rem;color:var(--muted);margin-bottom:12px;}
    .plan-features li{padding:3px 0;border-bottom:1px solid var(--border);}
    .action-btn{background:var(--pi);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.82rem;font-family:inherit;width:100%;margin-top:8px;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 22px;border-radius:28px;font-weight:700;z-index:999;display:none;}
    @media(max-width:600px){.hero h1{font-size:1.4rem;}}
  </style>
</head>
<body>
<div class="lang-bar" id="langBar"></div>
<nav>
  <div class="nav-logo">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663669950079/kVVYsJULtVsqaYlo.png" alt="Keeta Track"/>
    <div class="nav-logo-text">KEETA TRACK</div>
  </div>
  <button class="btn-login" id="loginBtn" onclick="loginWithPi()">Login with Pi</button>
</nav>
<div class="hero">
  <h1 id="heroTitle">Track with <span>Pi</span></h1>
  <p id="heroSub">Real-time shipment tracking powered by Pi Network</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Enter tracking number..."/>
    <button id="searchBtn">Track</button>
  </div>
</div>
<div class="stats-bar">
  <div class="stat"><div class="stat-num">1M+</div><div class="stat-label" id="stat1">Shipments</div></div>
  <div class="stat"><div class="stat-num">180+</div><div class="stat-label" id="stat2">Countries</div></div>
  <div class="stat"><div class="stat-num">99.9%</div><div class="stat-label" id="stat3">Accuracy</div></div>
  <div class="stat"><div class="stat-num">24/7</div><div class="stat-label" id="stat4">Live Updates</div></div>
</div>
<div class="section">
  <div class="section-title" id="activeTitle">Active Shipments</div>
  <div class="track-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="track-id">KT-2026-001</span>
      <span class="badge">In Transit</span>
    </div>
    <div class="steps">
      <div class="step done"><div class="step-dot"></div>Ordered</div>
      <div class="step done"><div class="step-dot"></div>Picked Up</div>
      <div class="step active"><div class="step-dot"></div>In Transit</div>
      <div class="step"><div class="step-dot"></div>Delivered</div>
    </div>
  </div>
</div>
<div class="section">
  <div class="section-title" id="plansTitle">Subscription Plans</div>
  <div class="plan-grid" id="plansGrid"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var LANGS={en:{name:'English',flag:'EN',dir:'ltr'},ar:{name:'Arabic',flag:'AR',dir:'rtl'},zh:{name:'Chinese',flag:'ZH',dir:'ltr'},vi:{name:'Viet',flag:'VI',dir:'ltr'},id:{name:'Bahasa',flag:'ID',dir:'ltr'},ko:{name:'Korean',flag:'KO',dir:'ltr'},hi:{name:'Hindi',flag:'HI',dir:'ltr'},es:{name:'Espanol',flag:'ES',dir:'ltr'}};
var LABELS={
  en:{hero:'Track with Pi',sub:'Real-time shipment tracking powered by Pi Network',search:'Enter tracking number...',searchBtn:'Track',login:'Login with Pi',s1:'Shipments',s2:'Countries',s3:'Accuracy',s4:'Live Updates',active:'Active Shipments',plans:'Subscription Plans'},
  ar:{hero:'تتبع مع Pi',sub:'تتبع الشحنات في الوقت الفعلي بـ Pi Network',search:'ادخل رقم التتبع...',searchBtn:'تتبع',login:'دخول بـ Pi',s1:'شحنة',s2:'دولة',s3:'دقة',s4:'تحديثات مباشرة',active:'الشحنات النشطة',plans:'خطط الاشتراك'},
  zh:{hero:'用Pi追踪',sub:'由Pi Network驱动的实时货运追踪',search:'输入追踪号...',searchBtn:'追踪',login:'Pi登录',s1:'货运',s2:'国家',s3:'准确率',s4:'实时更新',active:'活跃货运',plans:'订阅计划'},
  vi:{hero:'Theo doi voi Pi',sub:'Theo doi lo hang thoi gian thuc boi Pi Network',search:'Nhap ma theo doi...',searchBtn:'Theo doi',login:'Dang nhap Pi',s1:'Lo hang',s2:'Quoc gia',s3:'Do chinh xac',s4:'Cap nhat truc tiep',active:'Lo hang dang hoat dong',plans:'Goi dang ky'},
  id:{hero:'Lacak dengan Pi',sub:'Pelacakan pengiriman real-time oleh Pi Network',search:'Masukkan nomor lacak...',searchBtn:'Lacak',login:'Masuk Pi',s1:'Pengiriman',s2:'Negara',s3:'Akurasi',s4:'Update Langsung',active:'Pengiriman Aktif',plans:'Paket Langganan'},
  ko:{hero:'Pi로 추적',sub:'Pi Network으로 구동되는 실시간 배송 추적',search:'운송장 번호 입력...',searchBtn:'추적',login:'Pi 로그인',s1:'배송',s2:'국가',s3:'정확도',s4:'실시간 업데이트',active:'진행중 배송',plans:'구독 플랜'},
  hi:{hero:'Pi se Track Karen',sub:'Pi Network dwara real-time shipment tracking',search:'Tracking number dalein...',searchBtn:'Track Karen',login:'Pi se Login',s1:'Shipment',s2:'Desh',s3:'Shuddhata',s4:'Live Updates',active:'Sakriya Shipment',plans:'Subscription Yojana'},
  es:{hero:'Rastrea con Pi',sub:'Seguimiento de envios en tiempo real por Pi Network',search:'Ingresa numero de rastreo...',searchBtn:'Rastrear',login:'Iniciar sesion Pi',s1:'Envios',s2:'Paises',s3:'Precision',s4:'Actualizaciones en vivo',active:'Envios Activos',plans:'Planes de Suscripcion'}
};
var PLANS=[
  {name:'Free',price:'0 pi/mo',features:['5 shipments/mo','Basic tracking','Email alerts'],featured:false},
  {name:'Pro',price:'10 pi/mo',features:['50 shipments/mo','SMS alerts','Advanced reports','API access'],featured:true},
  {name:'Business',price:'25 pi/mo',features:['Unlimited shipments','Priority support','Custom reports','Team access'],featured:false}
];
var currentLang=localStorage.getItem('pi_lang')||'en';
function buildLangBar(){document.getElementById('langBar').innerHTML=Object.entries(LANGS).map(function(e){var code=e[0],l=e[1];return '<button class="lang-btn'+(code===currentLang?' active':'')+'" onclick="setLang(\''+code+'\')">'+l.flag+' '+l.name+'</button>';}).join('');}
function setLang(lang){currentLang=lang;localStorage.setItem('pi_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=LANGS[lang].dir;renderAll();}
function renderAll(){
  var lb=LABELS[currentLang]||LABELS.en;
  buildLangBar();
  document.getElementById('heroTitle').innerHTML=lb.hero.replace('Pi','<span>Pi</span>');
  document.getElementById('heroSub').textContent=lb.sub;
  document.getElementById('searchInput').placeholder=lb.search;
  document.getElementById('searchBtn').textContent=lb.searchBtn;
  document.getElementById('loginBtn').textContent=lb.login;
  document.getElementById('stat1').textContent=lb.s1;
  document.getElementById('stat2').textContent=lb.s2;
  document.getElementById('stat3').textContent=lb.s3;
  document.getElementById('stat4').textContent=lb.s4;
  document.getElementById('activeTitle').textContent=lb.active;
  document.getElementById('plansTitle').textContent=lb.plans;
  document.getElementById('plansGrid').innerHTML=PLANS.map(function(p){return '<div class="plan-card'+(p.featured?' featured':'')+'"><div class="plan-name">'+p.name+'</div><div class="plan-price">'+p.price+'</div><ul class="plan-features">'+p.features.map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul><button class="action-btn" onclick="subscribePlan(\''+p.name+'\','+p.price.split(' ')[0]+')">Subscribe</button></div>';}).join('');
}
function subscribePlan(name,price){
  if(price===0){showToast('Free plan activated!');return;}
  Pi.createPayment({amount:price,memo:'Keeta Track: '+name+' Plan',metadata:{app:'keeta-track'}},{
    onReadyForServerApproval:function(id){},
    onReadyForServerCompletion:function(id,txid){showToast('Subscribed to '+name+'!');},
    onCancel:function(){},onError:function(e){}
  });
}
function loginWithPi(){Pi.authenticate(['username','payments'],function(){}).then(function(auth){document.getElementById('loginBtn').textContent=auth.user.username;}).catch(function(){});}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
renderAll();
// Auto-authenticate on load as required by Pi App Studio
window.addEventListener('load', function(){
  try{
    Pi.init({version:'2.0'});
  }catch(e){}
  try{
    Pi.authenticate(['username','payments'], function(p){ console.log('Incomplete:',p); }).then(function(auth){
      if(auth && auth.user){
        try{ var btn=document.getElementById('loginBtn'); if(btn) btn.textContent=auth.user.username; }catch(e){}
      }
    }).catch(function(e){ console.log('Auth error:',e); });
  }catch(e){ console.log('Pi SDK error:',e); }
});
</script>
</body>
</html>
